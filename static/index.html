<!DOCTYPE html>
<html>
<head>
  <title>QT Scholarship Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg:#1f2348;
      --card-bg:#ffffff;
      --accent1:#ff7b00;
      --accent2:#ff9800;
      --text:#1e1e1e;
      --light:#f7f8fc;
    }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      font-family:"Inter",Arial,sans-serif;
    }

    /* FIXED: NO flex center for mobile */
    .page{
      display:block;
      width:100%;
      padding:20px 10px;
      box-sizing:border-box;
    }

    /* FIXED: fully responsive card */
    .card {
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      padding: 24px 18px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:16px;
    }

    .logo-main{
      max-width:210px;
      width:50%;
    }

    h2{
      color:var(--accent1);
      font-size:1.8rem;
      font-weight:800;
      margin:8px 0 22px 0;
      letter-spacing:.5px;
      text-align:center;
    }

    .input-group{text-align:left;margin-bottom:22px;}

    label{
      color:var(--accent1);
      font-weight:700;
      margin-bottom:10px;
      display:block;
      font-size:1.05rem;
    }

    input{
      width:100%;
      padding:14px 14px;
      font-size:1.12rem;
      border:1px solid #d8d8dd;
      border-radius:10px;
      background:var(--light);
      outline:none;
      box-sizing:border-box;
    }

    button{
      width:100%;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      border:none;
      padding:14px;
      color:#fff;
      font-size:1.15rem;
      font-weight:700;
      border-radius:12px;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(255,128,0,0.3);
      transition:transform .1s ease;
    }

    button:active{transform:scale(.97);}
    button:disabled{opacity:.7;}

    .spinner{
      height:28px;width:28px;border:4px solid #ddd;border-top-color:var(--accent1);
      border-radius:50%;animation:spin .9s linear infinite;margin:auto;margin-top:12px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}


    #results{margin-top:22px;text-align:left;}

    .result-table{
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 4px 24px rgba(0,0,0,0.12);
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:1rem;
    }

    thead th{
      background:linear-gradient(90deg,var(--accent2),var(--accent1));
      padding:14px 12px;
      color:#fff;
      text-align:left;
      font-size:1rem;
      font-weight:700;
    }

    tbody td{
      padding:14px 12px;
      border-bottom:1px solid #f1f1f3;
      color:var(--text);
      word-break: break-word;
    }

    .table-scroll{
      overflow-x:auto;
      width:100%;
    }

    /* ---------- MOBILE FIXES ---------- */
    @media(max-width:650px){

  /* Remove any chance of overflow */
  .table-scroll {
    overflow-x: hidden !important;
  }

  table {
    width: 100% !important;
    min-width: unset !important;
  }

  thead { display: none; }

  table, tbody, tr, td {
    display: block;
    width: 100%;
  }

  /* Mobile card look */
  tbody tr {
    margin-bottom: 14px;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 10px;
    background: #fff;
  }

  /* Make content fit nicely without scrolling */
  tbody td {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 6px;
    border-bottom: none;
    word-break: break-word;
    white-space: normal;
    font-size: 0.92rem;
  }

  td::before {
    content: attr(data-label);
    font-weight: 700;
    color: var(--accent1);
    flex-basis: 40%;
    font-size: 0.92rem;
  }
}


    .no-results{
      padding:14px;
      background:#fff3e8;
      border-left:5px solid var(--accent1);
      border-radius:8px;
      font-size:1.05rem;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">

      <div class="logo-wrap">
        <img class="logo-main"
             src="logo.png"
             onerror="this.src='https://qualitythought.in/wp-content/uploads/2025/10/1-3-2048x694.png';">
      </div>

      <h2>QT Scholarship Results</h2>

      <form id="searchForm" onsubmit="return handleSubmit(event)">
        <div class="input-group">
          <label>Enter Mobile Number or Hall Ticket</label>
          <input id="query" placeholder="Example: 8885261915 or QTQCST0003">
        </div>
        <button id="searchBtn">Search</button>
        <div id="spinnerWrap" style="display:none;">
          <span class="spinner"></span>
        </div>
      </form>

      <div id="results"></div>

    </div>
  </div>

<script>
function esc(s){
  if(!s) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

var resultsEl=document.getElementById('results');
var searchBtn=document.getElementById('searchBtn');
var spinnerWrap=document.getElementById('spinnerWrap');

function setLoading(v){
  searchBtn.disabled=v;
  spinnerWrap.style.display=v?"block":"none";
}

function handleSubmit(e){
  e.preventDefault();
  var q=document.getElementById('query').value.trim();

  if(!q){
    resultsEl.innerHTML='<div class="no-results"><strong>Please enter a value.</strong></div>';
    return;
  }

  resultsEl.innerHTML='<div class="no-results"><em>Searching...</em></div>';
  setLoading(true);

  fetch("/search?query="+encodeURIComponent(q))
    .then(r=>r.json())
    .then(d=>{
      setLoading(false);
      displayResults(d);
    })
    .catch(()=>{
      setLoading(false);
      resultsEl.innerHTML='<div class="no-results"><strong>Error:</strong> Unable to fetch results</div>';
    });
}

function displayResults(response){
  if(!response || !response.found){
    resultsEl.innerHTML='<div class="no-results"><strong>No results found.</strong></div>';
    return;
  }

  var rows=response.data;
  var headers=response.columns;

  var html='<div class="result-table table-scroll"><table><thead><tr>';
  headers.forEach(h=>html+=`<th>${esc(h)}</th>`);
  html+='</tr></thead><tbody>';

  rows.forEach(row=>{
    html+="<tr>";
    headers.forEach(h=>{
      html+=`<td data-label="${esc(h)}">${esc(row[h] || "")}</td>`;
    });
    html+="</tr>";
  });

  html+="</tbody></table></div>";
  resultsEl.innerHTML=html;
}

document.getElementById("query").focus();
</script>
</body>
</html>
