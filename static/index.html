<!DOCTYPE html>
<html>
<head>
  <title>QT Scholarship Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg:#1f2348;
      --card-bg:#ffffff;
      --accent1:#ff7b00;
      --accent2:#ff9800;
      --text:#1e1e1e;
      --light:#f7f8fc;
    }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      font-family:"Inter",Arial,sans-serif;
    }

    .page{
      display:block;
      width:100%;
      padding:20px 10px;
      box-sizing:border-box;
    }

    .card {
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      padding: 24px 18px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:16px;
    }

    .logo-main{
      max-width:210px;
      width:50%;
    }

    h2{
      color:var(--accent1);
      font-size:1.8rem;
      font-weight:800;
      margin:8px 0 22px 0;
      letter-spacing:.5px;
      text-align:center;
    }

    .input-group{text-align:left;margin-bottom:22px;}

    label{
      color:var(--accent1);
      font-weight:700;
      margin-bottom:10px;
      display:block;
      font-size:1.05rem;
    }

    input{
      width:100%;
      padding:14px 14px;
      font-size:1.12rem;
      border:1px solid #d8d8dd;
      border-radius:10px;
      background:var(--light);
      outline:none;
      box-sizing:border-box;
    }

    button{
      width:100%;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      border:none;
      padding:14px;
      color:#fff;
      font-size:1.15rem;
      font-weight:700;
      border-radius:12px;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(255,128,0,0.3);
      transition:transform .1s ease;
    }

    button:active{transform:scale(.97);}
    button:disabled{opacity:.7;}

    .spinner{
      height:28px;width:28px;border:4px solid #ddd;border-top-color:var(--accent1);
      border-radius:50%;animation:spin .9s linear infinite;margin:auto;margin-top:12px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    #results{margin-top:22px;text-align:left;}

    /* IMPROVED: Compact Admit Card Style */
    .admit-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid var(--accent1);
    }

    .admit-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f1f1f3;
    }

    .admit-card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(blue);
      margin: 0;
    }

    .admit-card-status {
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .admit-card-details {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 700;
      color: var(--accent1);
      font-size: 0.9rem;
      flex: 0 0 40%;
      padding-right: 10px;
    }

    .detail-value {
      color: var(--text);
      font-size: 0.95rem;
      flex: 0 0 60%;
      text-align: right;
      word-break: break-word;
    }

    .no-results{
      padding:14px;
      background:#fff3e8;
      border-left:5px solid var(--accent1);
      border-radius:8px;
      font-size:1.05rem;
      margin-top:10px;
    }

    /* Responsive adjustments for better column handling */
    @media (min-width: 768px) {
      .admit-card-details {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      
      .detail-row {
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        border-bottom: none;
        padding: 6px 0;
      }
      
      .detail-label {
        flex: none;
        font-size: 0.85rem;
        margin-bottom: 2px;
        padding-right: 0;
      }
      
      .detail-value {
        flex: none;
        text-align: left;
        font-size: 0.9rem;
      }
    }

    @media (min-width: 1024px) {
      .admit-card-details {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
    }

    /* For very large number of columns */
    .compact-view .detail-label {
      font-size: 0.8rem;
    }
    
    .compact-view .detail-value {
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">

      <div class="logo-wrap">
        <img class="logo-main"
             src="logo.png"
             onerror="this.src='https://qualitythought.in/wp-content/uploads/2025/10/1-3-2048x694.png';">
      </div>

      <h2>Quantum Computing Scholarship Results</h2>

      <form id="searchForm" onsubmit="return handleSubmit(event)">
        <div class="input-group">
          <label>Enter Mobile Number or Hall Ticket</label>
          <input id="query" placeholder="Example: 8885261915 or QTQCST0003">
        </div>
        <button id="searchBtn">Search</button>
        <div id="spinnerWrap" style="display:none;">
          <span class="spinner"></span>
        </div>
      </form>

      <div id="results"></div>

    </div>
  </div>

<script>
function esc(s){
  if(!s) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

var resultsEl=document.getElementById('results');
var searchBtn=document.getElementById('searchBtn');
var spinnerWrap=document.getElementById('spinnerWrap');

function setLoading(v){
  searchBtn.disabled=v;
  spinnerWrap.style.display=v?"block":"none";
}

function handleSubmit(e){
  e.preventDefault();
  var q=document.getElementById('query').value.trim();

  if(!q){
    resultsEl.innerHTML='<div class="no-results"><strong>Please enter a value.</strong></div>';
    return;
  }

  resultsEl.innerHTML='<div class="no-results"><em>Searching...</em></div>';
  setLoading(true);

  fetch("/search?query="+encodeURIComponent(q))
    .then(r=>r.json())
    .then(d=>{
      setLoading(false);
      displayResults(d);
    })
    .catch(()=>{
      setLoading(false);
      resultsEl.innerHTML='<div class="no-results"><strong>Error:</strong> Unable to fetch results</div>';
    });
}

function displayResults(response){
  if(!response || !response.found){
    resultsEl.innerHTML='<div class="no-results"><strong>No results found.</strong></div>';
    return;
  }

  var rows = response.data;
  var headers = response.columns;
  
  var html = '';
  
  rows.forEach(row => {
    // Count how many columns we have to decide on compact view
    const columnCount = headers.length;
    const useCompactView = columnCount > 8;
    
    html += `
      <div class="admit-card ${useCompactView ? 'compact-view' : ''}">
        <div class="admit-card-header">
          <h3 class="admit-card-title">🎉Checkout Results🎉 </h3>
          
        </div>
        <div class="admit-card-details">
    `;
    
    // Dynamically generate detail rows based on the actual Excel columns
    headers.forEach(header => {
      if (header !== 'Status') { // Status is already shown in the header
        const value = row[header] || "";
        if (value) { // Only show fields that have values
          html += `
            <div class="detail-row">
              <span class="detail-label">${esc(header)}</span>
              <span class="detail-value">${esc(value)}</span>
            </div>
          `;
        }
      }
    });
    
    html += `
        </div>
      </div>
    `;
  });
  
  resultsEl.innerHTML = html;
}

document.getElementById("query").focus();
</script>
</body>
</html>
